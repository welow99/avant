<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まゆりメルマガ</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="container">
  <article class="body">
    <h1 class="center">「勝ちたければこれを読め」</h1>
    <form action="https://hakurin55.com/p/r/CQ9OscCk" enctype="multipart/form-data" method="post" accept-charset="utf-8" style="width:100%;display:flex;flex-direction:column;box-sizing:border-box;font-family:-apple-system,sans-serif;">
    <input type="hidden" name="_method" value="POST">
    <input type="hidden" id="server_url" value="https://hakurin55.com/">
    <input type="hidden" name="data[User][referer_form_url]" value="" class="UserRefererFormUrl">
    <input type="hidden" name="data[User][referer_url]" value="" class="UserRefererUrl">
    <input type="text" name="data[User][mail]" id="Usermail" placeholder="メールアドレスを入力" required="" style="width:100%;padding:12px 14px;font-size:15px;font-family:inherit;color:#111;background:#fff;border:1px solid #ccc;border-radius:2px;outline:none;margin-bottom:8px;box-sizing:border-box;-webkit-appearance:none;">
    <input type="submit" value="送信" style="display:none;">
    <button type="submit" style="width:100%;padding:13px 16px;background:#111;border:none;border-radius:2px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:500;color:#fff;letter-spacing:0.03em;box-sizing:border-box;">登録する</button>
    </form>
    <script>
    (function(){
    if (document.referrer) {
    var ru = document.getElementsByClassName("UserRefererUrl");
    for (var i = 0; i < ru.length; i++) ru[i].value = document.referrer;
    }
    var rfu = document.getElementsByClassName("UserRefererFormUrl");
    for (var i = 0; i < rfu.length; i++) rfu[i].value = location.href;
    })();
    </script>
  </article>
</div>
</body>
</html>
